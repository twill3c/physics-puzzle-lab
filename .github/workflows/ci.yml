name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  loop-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # LL-11: ループログの validate 合格をループ完了条件に含める
      - name: Validate loop logs
        run: python harness/looplog.py validate

      # N-07 / G-13: 日本語本文への別字種・制御文字の混入検査
      - name: Text hygiene
        run: python harness/text_hygiene.py
